<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אטקין חברון עו"ד | כרטיס ביקור דיגיטלי</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Heebo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gold: #C9A961;
            --deep-navy: #1A2332;
            --soft-navy: #2C3E50;
            --cream: #F8F6F1;
            --accent-gold: #D4AF37;
            --text-light: #ECF0F1;
            --shadow-strong: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Assistant', sans-serif;
            background: linear-gradient(135deg, #0F2027 0%, #203A43 50%, #2C5364 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(201, 169, 97, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            top: -200px;
            right: -200px;
            animation: float 20s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(201, 169, 97, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -150px;
            left: -150px;
            animation: float 15s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(30px, -30px) rotate(5deg); }
            50% { transform: translate(0, -50px) rotate(0deg); }
            75% { transform: translate(-30px, -30px) rotate(-5deg); }
        }

        .card-container {
            position: relative;
            z-index: 1;
            animation: slideIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            opacity: 0;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .business-card {
            background: linear-gradient(145deg, var(--deep-navy) 0%, var(--soft-navy) 100%);
            border-radius: 24px;
            padding: 50px;
            max-width: 600px;
            width: 100%;
            box-shadow: 
                0 25px 60px var(--shadow-strong),
                0 5px 15px rgba(0, 0, 0, 0.2),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(201, 169, 97, 0.2);
        }

        .business-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                var(--primary-gold) 20%, 
                var(--accent-gold) 50%, 
                var(--primary-gold) 80%, 
                transparent 100%
            );
            opacity: 0.8;
        }

        .decorative-corner {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 2px solid rgba(201, 169, 97, 0.15);
            border-radius: 50%;
            top: -75px;
            right: -75px;
            pointer-events: none;
        }

        .decorative-corner::after {
            content: '';
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid rgba(201, 169, 97, 0.1);
            border-radius: 50%;
            top: 25px;
            right: 25px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInScale 1s ease-out 0.3s both;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .logo-image {
            width: 120px;
            height: auto;
            margin: 0 auto 20px;
            filter: drop-shadow(0 8px 20px rgba(201, 169, 97, 0.3));
            animation: logoFloat 6s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .firm-name {
            font-family: 'Heebo', sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s ease-out 0.5s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .firm-subtitle {
            font-size: 16px;
            color: var(--primary-gold);
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                var(--primary-gold) 50%, 
                transparent 100%
            );
            margin: 35px 0;
            opacity: 0.6;
            animation: expandWidth 1s ease-out 0.8s both;
        }

        @keyframes expandWidth {
            from {
                transform: scaleX(0);
            }
            to {
                transform: scaleX(1);
            }
        }

        .contact-info {
            animation: fadeInUp 0.8s ease-out 1s both;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .contact-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--primary-gold), var(--accent-gold));
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .contact-item:hover {
            background: rgba(201, 169, 97, 0.08);
            border-color: rgba(201, 169, 97, 0.3);
            transform: translateX(-5px);
        }

        .contact-item:hover::before {
            transform: scaleY(1);
        }

        .icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            color: var(--primary-gold);
            filter: drop-shadow(0 2px 4px rgba(201, 169, 97, 0.4));
        }

        .contact-label {
            font-size: 13px;
            color: var(--primary-gold);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 60px;
        }

        .contact-value {
            color: var(--text-light);
            font-size: 16px;
            font-weight: 400;
            direction: ltr;
            text-align: left;
            flex: 1;
        }

        .contact-value a {
            color: var(--text-light);
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
        }

        .contact-value a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--primary-gold);
            transition: width 0.3s ease;
        }

        .contact-value a:hover {
            color: var(--primary-gold);
        }

        .contact-value a:hover::after {
            width: 100%;
        }

        .specialties {
            margin-top: 35px;
            padding-top: 30px;
            border-top: 1px solid rgba(201, 169, 97, 0.2);
            animation: fadeInUp 0.8s ease-out 1.2s both;
        }

        .specialties-title {
            font-size: 14px;
            color: var(--primary-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: 600;
            text-align: center;
        }

        .specialty-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .tag {
            background: rgba(201, 169, 97, 0.12);
            color: var(--text-light);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(201, 169, 97, 0.25);
            transition: all 0.3s ease;
            cursor: default;
            position: relative;
            overflow: hidden;
        }

        .tag::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .tag:hover {
            background: rgba(201, 169, 97, 0.2);
            border-color: var(--primary-gold);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(201, 169, 97, 0.3);
        }

        .tag:hover::before {
            left: 100%;
        }

        .cta-section {
            text-align: center;
            margin-top: 35px;
            animation: fadeInUp 0.8s ease-out 1.4s both;
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-gold) 0%, var(--accent-gold) 100%);
            color: var(--deep-navy);
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(201, 169, 97, 0.4);
            position: relative;
            overflow: hidden;
            border: none;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--primary-gold) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .cta-button span {
            position: relative;
            z-index: 1;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(201, 169, 97, 0.5);
        }

        .cta-button:hover::before {
            opacity: 1;
        }

        .cta-button:active {
            transform: translateY(-1px);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            animation: fadeInUp 0.8s ease-out 1.6s both;
        }

        .social-link {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(201, 169, 97, 0.12);
            border: 1px solid rgba(201, 169, 97, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .social-link::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--primary-gold), var(--accent-gold));
            opacity: 0;
            transition: opacity 0.4s ease;
            border-radius: 50%;
        }

        .social-link svg {
            width: 24px;
            height: 24px;
            color: var(--primary-gold);
            position: relative;
            z-index: 1;
            transition: all 0.4s ease;
        }

        .social-link:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 10px 25px rgba(201, 169, 97, 0.4);
            border-color: var(--primary-gold);
        }

        .social-link:hover::before {
            opacity: 1;
        }

        .social-link:hover svg {
            color: var(--deep-navy);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 30px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-phone {
            background: linear-gradient(135deg, var(--primary-gold) 0%, var(--accent-gold) 100%);
            color: var(--deep-navy);
            box-shadow: 0 8px 20px rgba(201, 169, 97, 0.4);
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #25D366 0%, #1EBE57 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4);
        }

        .action-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .btn-phone::before {
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--primary-gold) 100%);
        }

        .btn-whatsapp::before {
            background: linear-gradient(135deg, #1EBE57 0%, #25D366 100%);
        }

        .action-btn span {
            position: relative;
            z-index: 1;
        }

        .action-btn svg {
            position: relative;
            z-index: 1;
            width: 20px;
            height: 20px;
        }

        .action-btn:hover {
            transform: translateY(-3px);
        }

        .btn-phone:hover {
            box-shadow: 0 12px 30px rgba(201, 169, 97, 0.5);
        }

        .btn-whatsapp:hover {
            box-shadow: 0 12px 30px rgba(37, 211, 102, 0.5);
        }

        .action-btn:hover::before {
            opacity: 1;
        }

        .action-btn:active {
            transform: translateY(-1px);
        }

        @media (max-width: 640px) {
            .business-card {
                padding: 35px 25px;
            }

            .firm-name {
                font-size: 28px;
            }

            .firm-subtitle {
                font-size: 13px;
                letter-spacing: 2px;
            }

            .contact-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                padding: 12px 16px;
            }

            .contact-label {
                min-width: auto;
            }

            .contact-value {
                text-align: right;
                direction: rtl;
            }

            .specialty-tags {
                gap: 8px;
            }

            .tag {
                font-size: 12px;
                padding: 6px 14px;
            }

            .action-buttons {
                flex-direction: column;
                width: 100%;
            }

            .action-btn {
                width: 100%;
                justify-content: center;
            }

            .logo-image {
                width: 100px;
            }
        }
    </style>
</head>
